<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - المنصة التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-indigo-600 text-white font-bold rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 shadow-lg shadow-indigo-200">ض</div>
            <h1 class="text-2xl font-bold text-gray-800">المنصة التعليمية</h1>
            <p class="text-xs text-gray-500 mt-1">سجل دخولك للوصول إلى الموارد والتكليفات</p>
        </div>

        <form id="login-form" class="space-y-4" onsubmit="event.preventDefault(); handleLogin();">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">البريد الإلكتروني / اسم المستخدم</label>
                <input type="text" id="username" placeholder="example@domain.com" required class="w-full p-3 border rounded-xl outline-none text-sm focus:ring-2 focus:ring-indigo-500 bg-gray-50">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required class="w-full p-3 border rounded-xl outline-none text-sm focus:ring-2 focus:ring-indigo-500 bg-gray-50">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">نوع الحساب</label>
                <select id="role-select" class="w-full p-3 border rounded-xl outline-none text-sm focus:ring-2 focus:ring-indigo-500 bg-gray-50">
                    <option value="student">تلميذ</option>
                    <option value="teacher">أستاذ</option>
                </select>
            </div>

            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md shadow-indigo-100 text-sm">
                الدخول للمنصة
            </button>
        </form>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        function handleLogin() {
            const role = document.getElementById('role-select').value;
            const email = document.getElementById('username').value;
            loginUser(email, role);
        }
    </script>
</body>
</html>
