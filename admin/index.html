<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | الأستاذ عبد المجيد أيت عبو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-md p-6 space-y-5 border border-gray-100">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-indigo-700 text-white font-bold rounded-xl flex items-center justify-center mx-auto text-xl">🔐</div>
            <h2 class="text-lg font-bold text-gray-800">لوحة تحكم الأستاذ</h2>
            <p class="text-xs text-gray-500">أدخل كود المرور الخاص بك للوصول للإدارة</p>
        </div>

        <form onsubmit="event.preventDefault(); verifyCode();" class="space-y-4">
            <div>
                <input type="password" id="passcode" placeholder="أدخل كود المرور" required class="w-full text-center tracking-widest text-lg p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50">
            </div>
            <p id="error-msg" class="text-xs text-red-600 text-center hidden font-bold">كود المرور غير صحيح!</p>
            <button type="submit" class="w-full py-3 bg-indigo-700 text-white font-bold text-xs rounded-xl hover:bg-indigo-800 transition-all">دخول</button>
        </form>
    </div>

    <script>
        function verifyCode() {
            const code = document.getElementById('passcode').value;
            if(code === '111982') {
                localStorage.setItem('is_teacher', 'true');
                window.location.href = 'teacher/dashboard.html';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
