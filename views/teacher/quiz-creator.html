<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء اختبار إلكتروني - لوحة الأستاذ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <div class="max-w-4xl mx-auto p-6">
        <!-- العنوان -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <h1 class="text-2xl font-bold text-slate-900 mb-2">إنشاء اختبار إلكتروني جديد</h1>
            <p class="text-slate-500 text-sm">قم بإعداد إعدادات الاختبار والأسئلة لتظهر فوراً للتلاميذ.</p>
        </div>

        <!-- إعدادات الاختبار العامة -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 space-y-4">
            <h2 class="text-lg font-bold text-indigo-900 border-b pb-2">1. الإعدادات العامة</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">عنوان الاختبار</label>
                    <input type="text" placeholder="مثال: اختبار الوحدة الأولى" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">عدد الأسئلة المخصصة</label>
                    <select id="questionCount" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="10">10 أسئلة</option>
                        <option value="20">20 سؤال</option>
                        <option value="40">40 سؤال</option>
                    </select>
                </div>
            </div>

            <div class="bg-indigo-50 p-3 rounded-lg text-indigo-800 text-sm flex items-center gap-2">
                <span>ℹ️</span>
                <span>سلم التنقيط الافتراضي: <strong>نقطة واحدة (1 pt)</strong> لكل جواب صحيح.</span>
            </div>
        </div>

        <!-- نموذج السؤال الأول (كمثال للأسئلة المكررة) -->
        <div id="questionsContainer" class="space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="font-bold text-slate-700">السؤال رقم 1</span>
                    <select class="border border-slate-300 rounded-lg p-1.5 text-sm bg-slate-50">
                        <option value="mcq">اختيار من متعدد (MCQ)</option>
                        <option value="tf">صحيح / خطأ</option>
                    </select>
                </div>

                <div>
                    <input type="text" placeholder="اكتب نص السؤال هنا..." class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none font-medium">
                </div>

                <!-- خيارات الإجابة (تتغير حسب نوع السؤال) -->
                <div class="space-y-2 pr-4 border-r-2 border-indigo-500">
                    <div class="flex items-center gap-2">
                        <input type="radio" name="q1_correct" class="w-4 h-4 text-indigo-600">
                        <input type="text" placeholder="الخيار الأول (حدد الدائرة إذا كان هو الصحيح)" class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="radio" name="q1_correct" class="w-4 h-4 text-indigo-600">
                        <input type="text" placeholder="الخيار الثاني" class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                    </div>
                </div>
            </div>
        </div>

        <!-- زر الحفظ -->
        <div class="mt-6 flex justify-end">
            <button class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl shadow-md transition">
                حفظ ونشر الاختبار
            </button>
        </div>
    </div>

</body>
</html>
