<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المادة الشعرية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 text-white py-4 px-6 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">⚙️ لوحة تحكم الأبيات</h1>
            <p class="text-xs text-slate-300">أضف ووسع المادة الشعرية للتطبيق</p>
        </div>
        <a href="index.html" class="bg-emerald-600 hover:bg-emerald-500 text-xs font-bold py-2 px-4 rounded-lg transition">
            ↩️ العودة للمساجلة
        </a>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 flex-grow grid grid-cols-1 md:grid-cols-3 gap-6 my-6">
        
        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm h-fit">
            <h2 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2 border-slate-100">إضافة بيت جديد</h2>
            <form id="add-verse-form" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">البيت الشعري (استخدم * للفصل بين الشطرين):</label>
                    <input type="text" id="verse-text" required placeholder="مَا كُلُّ مَا يَتَمَنَّى... * تَجْرِي الرِّيَاحُ..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-emerald-600">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">الحرف الأول:</label>
                        <input type="text" id="first-letter" maxlength="1" required placeholder="م" class="w-full text-center border border-slate-300 rounded-lg p-2 text-sm focus:outline-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">حرف الروي:</label>
                        <input type="text" id="rawiyy-letter" maxlength="1" required placeholder="ن" class="w-full text-center border border-slate-300 rounded-lg p-2 text-sm focus:outline-emerald-600">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">اسم الشاعر (اختياري):</label>
                    <input type="text" id="poet-name" placeholder="المتنبي" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-emerald-600">
                </div>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-sm transition cursor-pointer shadow">حفظ البيت</button>
            </form>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm md:col-span-2 flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-2 border-slate-100">
                <h2 class="text-lg font-bold text-slate-700">المادة الشعرية المتوفرة (<span id="total-count">0</span>)</h2>
                <button id="reset-db-btn" class="text-xs bg-rose-100 hover:bg-rose-200 text-rose-700 px-3 py-1 rounded transition cursor-pointer">إعادة ضبط المصنع</button>
            </div>
            
            <div class="overflow-y-auto max-h-[400px] flex-grow">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-100 text-slate-600 sticky top-0">
                        <tr>
                            <th class="p-2 rounded-r-lg">البيت</th>
                            <th class="p-2 text-center">البداية</th>
                            <th class="p-2 text-center">الروي</th>
                            <th class="p-2 text-center rounded-l-lg">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="verses-table-body" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </div>

    </main>

    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200">
        لوحة التحكم بالتطبيق التجريبي
    </footer>

    <script src="js/database.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
