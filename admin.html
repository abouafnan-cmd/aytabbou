<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المادة الشعرية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- شاشة الحماية والقفل بكلمة المرور 1982 -->
    <div id="password-overlay" class="fixed inset-0 bg-slate-900 flex flex-col justify-center items-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full text-center flex flex-col gap-4">
            <h2 class="text-xl font-bold text-slate-700">🔒 منطقة محمية</h2>
            <p class="text-xs text-slate-400">يرجى إدخال كلمة المرور للوصول إلى المادة الشعرية</p>
            <input type="password" id="admin-password-input" placeholder="••••" class="w-full text-center border border-slate-300 rounded-lg p-3 text-xl focus:outline-emerald-600 tracking-widest">
            <button id="login-btn" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2 rounded-lg text-sm transition cursor-pointer">دخول</button>
            <p id="login-error" class="text-xs text-rose-600 font-bold hidden">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <!-- محتوى الإدارة المحمي -->
    <div id="admin-content" class="hidden flex-grow flex flex-col justify-between min-h-screen">
        <header class="bg-slate-800 text-white py-4 px-6 shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">⚙️ لوحة تحكم الأبيات الشعرية</h1>
                <p class="text-xs text-slate-300">توسيع المادة وتدقيق القوافي والروي</p>
            </div>
            <div class="flex gap-2">
                <button id="logout-btn" class="bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 px-3 rounded-lg transition cursor-pointer">خروج</button>
                <a href="index.html" class="bg-emerald-600 hover:bg-emerald-500 text-xs font-bold py-2 px-4 rounded-lg transition">↩️ العودة للمساجلة</a>
            </div>
        </header>

        <main class="max-w-4xl w-full mx-auto p-4 flex-grow grid grid-cols-1 md:grid-cols-3 gap-6 my-6">
            <!-- نموذج الإدخال الفردي -->
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm h-fit">
                <h2 class="text-base font-bold text-slate-700 mb-4 border-b pb-2 border-slate-100">إضافة بيت جديد</h2>
                <form id="add-verse-form" class="flex flex-col gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">البيت الشعري (افصل الشطرين بـ *):</label>
                        <input type="text" id="verse-text" required placeholder="جَزَى اللَّهُ عَنَّا صَاحِباً... * وَأَضْعَفَ..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-emerald-600">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">الحرف الأول الأصلي:</label>
                            <input type="text" id="first-letter" maxlength="1" required placeholder="ج" class="w-full text-center border border-slate-300 rounded-lg p-2 text-sm focus:outline-emerald-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">حرف الروي الحقيقي:</label>
                            <input type="text" id="rawiyy-letter" maxlength="1" required placeholder="أ" class="w-full text-center border border-slate-300 rounded-lg p-2 text-sm focus:outline-emerald-600">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">اسم الشاعر (اختياري):</label>
                        <input type="text" id="poet-name" placeholder="المتنبي" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-emerald-600">
                    </div>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-sm transition cursor-pointer shadow">حفظ البيت في القاعدة</button>
                </form>
            </div>

            <!-- جدول استعراض كافة الحروف والمادة -->
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm md:col-span-2 flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b pb-2 border-slate-100">
                    <h2 class="text-base font-bold text-slate-700">المادة المخزنة حالياً (<span id="total-count">0</span> بيت)</h2>
                    <button id="reset-db-btn" class="text-xs bg-rose-100 hover:bg-rose-200 text-rose-700 px-3 py-1 rounded transition cursor-pointer">إعادة ضبط المصنع</button>
                </div>
                <div class="overflow-y-auto max-h-[430px] flex-grow">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-100 text-slate-600 sticky top-0">
                            <tr>
                                <th class="p-2 rounded-r-lg">البيت والشطرين</th>
                                <th class="p-2 text-center">البداية</th>
                                <th class="p-2 text-center">الروي</th>
                                <th class="p-2 text-center rounded-l-lg">إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="verses-table-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/database.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
