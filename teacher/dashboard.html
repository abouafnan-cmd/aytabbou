<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأستاذ | منصة اللغة العربية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        /* إخفاء شريط التمرير مع الإبقاء على فعاليته للهواتف */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* تأثيرات الظهور السلس */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <!-- الترويسة العلوية العصرية -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center text-xl backdrop-blur-sm">👨‍🏫</div>
                <div>
                    <h1 class="text-base md:text-xl font-bold leading-tight">الأستاذ عبد المجيد أيت عبو</h1>
                    <p class="text-xs text-indigo-200">لوحة الإدارة والتحكم</p>
                </div>
            </div>
            <a href="../index.html" class="bg-indigo-800 hover:bg-indigo-900 px-4 py-2 rounded-xl text-xs md:text-sm font-bold transition-all shadow-inner">خروج 🏠</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto mt-6 px-4 sm:px-6 lg:px-8 space-y-6">

        <!-- شريط التبويبات المتجاوب مع الهواتف (قابل للتمرير الأفقي) -->
        <div class="flex gap-2 overflow-x-auto hide-scrollbar border-b border-slate-200 pb-2">
            <button onclick="switchTab('announcements-tab', this)" class="tab-btn active-tab whitespace-nowrap px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-md transition-all">📢 الإخبارات والإعلانات</button>
            <button onclick="switchTab('quizzes-tab', this)" class="tab-btn whitespace-nowrap px-5 py-2.5 bg-white text-slate-600 hover:bg-slate-100 rounded-xl text-sm font-bold border border-slate-200 transition-all">📝 الاختبارات</button>
            <button onclick="switchTab('students-tab', this)" class="tab-btn whitespace-nowrap px-5 py-2.5 bg-white text-slate-600 hover:bg-slate-100 rounded-xl text-sm font-bold border border-slate-200 transition-all">👨‍🎓 لائحة التلاميذ</button>
            <button onclick="switchTab('lessons-tab', this)" class="tab-btn whitespace-nowrap px-5 py-2.5 bg-white text-slate-600 hover:bg-slate-100 rounded-xl text-sm font-bold border border-slate-200 transition-all">📚 الدروس والمكونات</button>
        </div>

        <!-- ==================== TAB 1: إدارة الإخبارات والإعلانات ==================== -->
        <section id="announcements-tab" class="tab-content fade-in space-y-6">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg md:text-xl font-bold text-indigo-900 border-b border-slate-100 pb-4 mb-5">إدارة الإخبارات والإعلانات</h2>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">نص الإخبار أو الإعلان</label>
                        <textarea id="announcement-text" rows="3" placeholder="اكتب هنا التنبيه، موعد الفرض، أو الإعلان العام..." class="w-full p-4 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all bg-slate-50 focus:bg-white resize-none text-sm"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-slate-700">تاريخ الإعلان</label>
                            <input type="date" id="announcement-date" class="w-full p-3.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 focus:bg-white text-sm">
                        </div>
                    </div>
                    <div class="pt-2">
                        <button class="w-full md:w-auto px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all text-sm">نشر الإعلان</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ==================== TAB 2: صانع الاختبارات ==================== -->
        <section id="quizzes-tab" class="tab-content hidden fade-in space-y-6">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg md:text-xl font-bold text-indigo-900 border-b border-slate-100 pb-4 mb-5">إنشاء اختبار إلكتروني جديد</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">عنوان الاختبار</label>
                        <input type="text" placeholder="مثال: تقويم تشخيصي" class="w-full p-3.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 focus:bg-white text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">المستوى الدراسي</label>
                        <select class="w-full p-3.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm">
                            <option>جذع مشترك علوم</option>
                            <option>جذع مشترك آداب</option>
                            <option>الأولى باكلوريا علوم</option>
                            <option>الأولى باكلوريا آداب</option>
                            <option>الثانية باكلوريا علوم</option>
                            <option>الثانية باكلوريا آداب</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">عدد الأسئلة</label>
                        <select id="quiz-count" onchange="generateQuestionsForm()" class="w-full p-3.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm">
                            <option value="10">10 أسئلة</option>
                            <option value="20">20 سؤالاً</option>
                            <option value="40">40 سؤالاً</option>
                        </select>
                    </div>
                </div>
                <div id="questions-builder-container" class="space-y-5 pt-6 mt-6 border-t border-slate-100"></div>
                <div class="pt-4">
                    <button class="w-full md:w-auto px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all text-sm">حفظ ونشر الاختبار</button>
                </div>
            </div>
        </section>

        <!-- ==================== TAB 3: إدارة التلاميذ والقسم ==================== -->
        <section id="students-tab" class="tab-content hidden fade-in space-y-6">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg md:text-xl font-bold text-indigo-900 border-b border-slate-100 pb-4 mb-5">إدارة لوائح التلاميذ والمعرفات الشخصية</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">اختيار المستوى الدراسي</label>
                        <select id="student-level-select" class="w-full p-3.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm">
                            <option>جذع مشترك علوم</option>
                            <option>جذع مشترك آداب</option>
                            <option>الأولى باكلوريا علوم</option>
                            <option>الأولى باكلوريا آداب</option>
                            <option>الثانية باكلوريا علوم</option>
                            <option>الثانية باكلوريا آداب</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">رقم / اسم القسم</label>
                        <input type="text" id="student-class-input" placeholder="مثال: 1 أو 2 أو أ" class="w-full p-3.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 focus:bg-white text-sm">
                    </div>
                </div>

                <div class="p-5 bg-indigo-50/50 rounded-2xl border border-indigo-100 space-y-3">
                    <h3 class="text-sm font-bold text-indigo-900">رفع لائحة قسم كامل عبر ملف TXT:</h3>
                    <p class="text-xs text-slate-500 leading-relaxed">تأكد من اختيار المستوى ورقم القسم أعلاه أولاً. صيغة السطر: <code class="bg-white px-2 py-0.5 border border-slate-200 rounded shadow-sm text-indigo-600">الاسم الكامل, المعرف الشخصي</code></p>
                    <input type="file" accept=".txt" class="block w-full text-sm text-slate-500 file:ml-3 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer transition-all">
                </div>
            </div>
        </section>

        <!-- ==================== TAB 4: إضافة وتعديل الدروس ==================== -->
        <section id="lessons-tab" class="tab-content hidden fade-in space-y-6">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg md:text-xl font-bold text-indigo-900 border-b border-slate-100 pb-4 mb-5">إضافة وتعديل الدروس</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">عنوان الدرس</label>
                        <input type="text" placeholder="مثال: التمييز وأحكامه" class="w-full p-3.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 focus:bg-white text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">المستوى الدراسي</label>
                        <select class="w-full p-3.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm">
                            <option>جذع مشترك علوم</option>
                            <option>جذع مشترك آداب</option>
                            <option>الأولى باكلوريا علوم</option>
                            <option>الأولى باكلوريا آداب</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold mb-2 text-slate-700">مكون المادة</label>
                        <select id="lesson-component" class="w-full p-3.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm font-bold text-indigo-900">
                            <option value="texts">📖 مكون النصوص</option>
                            <option value="language">📝 مكون الدرس اللغوي</option>
                            <option value="expression">✍️ مكون التعبير والإنشاء</option>
                            <option value="literature">📚 مكون المؤلفات</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold mb-2 text-slate-700">محتوى الدرس (رابط، ملخص، أو توجيه)</label>
                        <textarea rows="4" class="w-full p-4 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 focus:bg-white text-sm resize-none"></textarea>
                    </div>
                </div>
                
                <button class="w-full md:w-auto px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all text-sm">حفظ ونشر الدرس</button>
            </div>
        </section>

    </main>

    <script>
        // دالة تبديل التبويبات مع تغيير الألوان بشكل عصري
        function switchTab(tabId, btnElement) {
            // إخفاء المحتوى
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');

            // إعادة ضبط أزرار التبويب
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn whitespace-nowrap px-5 py-2.5 bg-white text-slate-600 hover:bg-slate-100 rounded-xl text-sm font-bold border border-slate-200 transition-all";
            });

            // تفعيل الزر المختار
            btnElement.className = "tab-btn active-tab whitespace-nowrap px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-md transition-all";
        }

        // دالة صانع الأسئلة (متجاوبة مع الهواتف)
        function generateQuestionsForm() {
            const count = parseInt(document.getElementById('quiz-count').value);
            const container = document.getElementById('questions-builder-container');
            container.innerHTML = '';

            for (let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div class="p-5 border border-slate-200 rounded-2xl bg-slate-50/50 space-y-4">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                            <span class="font-bold text-sm text-indigo-700 bg-indigo-100 px-3 py-1 rounded-lg w-fit">السؤال ${i}</span>
                            <select onchange="updateQuestionType(${i}, this.value)" class="text-xs sm:text-sm p-2 border border-slate-200 rounded-xl bg-white outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-auto">
                                <option value="mcq4">اختيار من متعدد (4 إجابات)</option>
                                <option value="mcq3">اختيار من متعدد (3 إجابات)</option>
                                <option value="tf">صحيح / خطأ</option>
                            </select>
                        </div>
                        <input type="text" placeholder="اكتب نص السؤال هنا..." class="w-full p-3.5 border border-slate-200 rounded-xl text-sm outline-none bg-white focus:ring-2 focus:ring-indigo-500">
                        <div id="q-options-${i}" class="space-y-2"></div>
                    </div>
                `;
                updateQuestionType(i, 'mcq4');
            }
        }

        function updateQuestionType(qNum, type) {
            const container = document.getElementById(`q-options-${qNum}`);
            if (type === 'tf') {
                container.innerHTML = `
                    <div class="flex gap-6 text-sm font-bold pt-2 px-2">
                        <label class="flex items-center gap-2 cursor-pointer text-emerald-700"><input type="radio" name="ans-${qNum}" value="true" checked class="w-4 h-4 accent-emerald-600"> صحيح</label>
                        <label class="flex items-center gap-2 cursor-pointer text-rose-700"><input type="radio" name="ans-${qNum}" value="false" class="w-4 h-4 accent-rose-600"> خطأ</label>
                    </div>
                `;
            } else {
                const count = type === 'mcq3' ? 3 : 4;
                let html = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2">';
                for(let k = 1; k <= count; k++) {
                    html += `
                        <div class="flex items-center gap-3 bg-white p-2 border border-slate-200 rounded-xl focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-indigo-500 transition-all">
                            <input type="radio" name="ans-${qNum}" class="w-4 h-4 accent-indigo-600 ml-1">
                            <input type="text" placeholder="الخيار ${k}" class="w-full outline-none text-sm bg-transparent">
                        </div>
                    `;
                }
                html += '</div>';
                container.innerHTML = html;
            }
        }

        // توليد نموذج أسئلة افتراضي عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            generateQuestionsForm();
            // تعيين تاريخ اليوم كافتراضي في تبويب الإعلانات
            document.getElementById('announcement-date').valueAsDate = new Date();
        });
    </script>
</body>
</html>
