        <nav class="space-x-4 space-x-reverse text-xs">

                <a href="assignments.html" class="px-4 py-2 bg-amber-600 text-white rounded-lg text-xs font-bold hover:bg-amber-700">+ إنشاء واجب منزل</a>
                <a href="quizzes.html" class="px-4 py-2 bg-purple-600 text-white rounded-lg text-xs font-bold hover:bg-purple-700">+ صانع الاختبارات</a>
